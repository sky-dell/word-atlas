    <script>
      // Apply the saved theme (dark by default) before first paint.
      (function () {
        var t = "starlight";
        try {
          var s = JSON.parse(localStorage.getItem("word-atlas:appearance") || "{}");
          if (s.theme) t = s.theme;
          document.documentElement.setAttribute('data-font',s.wordFont||'sans');
        } catch (e) {}
        if(t==='starlight'||t==='aurora'){document.documentElement.setAttribute('data-skin',t);document.documentElement.setAttribute('data-theme','dark');}
        else if (t !== "system") document.documentElement.setAttribute("data-theme", t);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
